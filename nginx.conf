server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Unveränderliche, gehashte Assets dauerhaft cachen
    location /_app/immutable/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        # /standplan/ -> /standplan (Verzeichnis ohne index.html würde sonst 403 liefern)
        rewrite ^/(.+)/$ /$1 permanent;

        # Prerenderte Seiten liegen als <route>.html vor (z.B. standplan.html)
        try_files $uri $uri.html $uri/index.html =404;
    }
}
